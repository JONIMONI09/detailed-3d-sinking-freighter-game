name: Continuous Integration & Physics Verification

on:
  push:
    # Run CI on feature branches too, so a branch can be verified before merge.
    branches: [main, master, "**"]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build & Verify Simulation Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # CodeGraph's PR context needs a real merge base. The default
          # depth-1 checkout has neither a local main nor its ancestry.
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for CI Check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare CodeGraph Base Branch
        run: |
          # actions/checkout can leave a feature checkout without origin/main.
          # A missing base ref must not fail the gate: the docs check falls back
          # to another available ref and CodeGraph itself is optional.
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Typecheck (Root & Sonnet)
        run: |
          npx tsc --noEmit
          npx tsc --project detailed-3d-sinking-freighter-game_sonnet/tsconfig.json --noEmit

      - name: Run Test Suite (Physics, Browser Guards, Python Integrity)
        run: npm test

      - name: Validate Skill and Documentation Governance
        run: npm run docs:check

      - name: Build Root Distribution
        run: npx vite build

      - name: Build Sonnet Distribution
        run: npx vite build detailed-3d-sinking-freighter-game_sonnet --outDir ../dist/sonnet --base ./

      - name: Verify Pages Artifact
        run: |
          # Mirror the Pages workflow exactly so a deploy-only build break is
          # caught here instead of on main.
          test -f dist/index.html
          test -f dist/sonnet/index.html
          du -sh dist
