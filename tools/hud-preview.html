<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HUD Layout Harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05080d;
        color: #94a3b8;
        font: 12px/1.3 ui-monospace, monospace;
        overflow: hidden;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 10px;
        align-items: flex-start;
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .frame-wrap {
        overflow: hidden;
        border: 1px solid #1e293b;
        background: #000;
      }
      iframe {
        border: 0;
        display: block;
        transform-origin: top left;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script>
      // Single:  /tools/hud-preview.html?w=844&h=390&s=1
      // Grid:    /tools/hud-preview.html?grid=1
      const q = new URLSearchParams(location.search);
      const specs = q.get('grid')
        ? [
            ['landscape-844x390', 844, 390, 0.55],
            ['landscape-740x360', 740, 360, 0.55],
            ['portrait-390x844', 390, 844, 0.33],
            ['desktop-1024x768', 1024, 768, 0.33],
          ]
        : [['single', Number(q.get('w')) || 844, Number(q.get('h')) || 390, Number(q.get('s')) || 1]];

      const grid = document.getElementById('grid');
      for (const [name, w, h, s] of specs) {
        const cell = document.createElement('div');
        cell.className = 'cell';

        const label = document.createElement('div');
        label.textContent = `${name} (${w}x${h})`;

        const wrap = document.createElement('div');
        wrap.className = 'frame-wrap';
        wrap.style.width = Math.round(w * s) + 'px';
        wrap.style.height = Math.round(h * s) + 'px';

        const frame = document.createElement('iframe');
        frame.src = '/';
        frame.dataset.name = name;
        frame.dataset.cssW = String(w);
        frame.dataset.cssH = String(h);
        frame.style.width = w + 'px';
        frame.style.height = h + 'px';
        frame.style.transform = 'scale(' + s + ')';

        wrap.append(frame);
        cell.append(label, wrap);
        grid.append(cell);
      }
    </script>
  </body>
</html>
